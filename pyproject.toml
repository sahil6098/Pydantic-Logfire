[project]
name = "pydantic-logfire"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sahil Sawant", email = "sahilsawant7120@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu==1.14.3",
    "google-generativeai==0.8.6",
    "ipykernel==7.3.0",
    "langchain==1.3.11",
    "langchain-community==0.4.2",
    "langchain-google-genai==4.2.7",
    "langchain-groq==1.1.3",
    "langchain-openai==1.3.3",
    "langchain-tavily==0.2.18",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.8",
    "logfire[httpx]==4.37.0",
    "logi==1.3.4",
    "openai==2.44.0",
    "python-dotenv==1.2.2",
    "streamlit==1.59.0",
]

[project.scripts]
pydantic-logfire = "pydantic_logfire:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
